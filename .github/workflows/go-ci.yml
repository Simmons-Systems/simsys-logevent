name: Go CI

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # go.mod declares `go 1.22` — test on the floor + the latest minor.
      matrix:
        go-version: ["1.22.x", "1.26.x"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          # No go.sum (zero deps) — nothing to cache.
          cache: false

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: go test (race detector)
        working-directory: go
        run: go test -race ./...

      - name: Fuzz smoke (5s per target, latest Go lane only)
        if: matrix.go-version == '1.26.x'
        working-directory: go
        run: |
          for target in FuzzLogEvent; do
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=5s .
          done
