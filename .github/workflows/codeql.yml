name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

# Default-deny at the top level (Scorecard Token-Permissions); the
# analyze job below re-grants exactly what CodeQL needs.
permissions:
  contents: read

jobs:
  analyze:
    # Pinned explicitly. GitHub derives an unnamed matrix job's title from
    # ALL its matrix keys, so adding `build-mode` silently renamed this job
    # from "Analyze (actions)" to "Analyze (actions, none)" — and
    # "Analyze (actions)" is the one required status check on main, so the
    # gate became unsatisfiable rather than failing loudly. Keep this name
    # keyed on language alone; changing it breaks the branch ruleset.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # `actions` alone scans workflow YAML and ZERO application source.
        # The three SDK languages are the point of the repo; they were
        # absent, so CodeQL reported green while analysing none of the
        # code this package actually ships.
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            # manual, not autobuild: the module lives in go/ rather than
            # the repo root. build-mode: none would silently produce an
            # EMPTY database rather than erroring.
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          # No go.sum (zero deps) — nothing to cache. Matches go-ci.yml.
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go (manual build-mode)
        if: matrix.language == 'go'
        working-directory: go
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:${{ matrix.language }}"
