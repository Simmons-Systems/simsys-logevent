[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "simsys-logevent"
version = "1.0.0"
description = "Structured log events for Python apps — JSON-per-line to stdout for systemd-journal → Loki pipelines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Simmons Systems" }]
requires-python = ">=3.10"
keywords = ["logging", "structured-logging", "json", "loki", "logql", "systemd", "journald", "observability"]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Simmons-Systems/simsys-logevent"
Repository = "https://github.com/Simmons-Systems/simsys-logevent"
Issues = "https://github.com/Simmons-Systems/simsys-logevent/issues"
Changelog = "https://github.com/Simmons-Systems/simsys-logevent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["simsys_logevent"]
